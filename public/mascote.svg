<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Mascote PLACEHOLDER do Ilustrando Estudos (livro aberto sorridente).
       O dono do projeto vai desenhar o mascote definitivo depois;
       basta substituir este arquivo (public/mascote.svg) mantendo o nome. -->
