  />
  <!-- página direita -->
  <path
    d="M52 20 Q42 15 32 20 L32 44 Q42 39 52 44 Z"
    fill="#ffffff"
    stroke="#d8d8d8"
    stroke-width="1.5"
    stroke-linejoin="round"
  />
  <!-- olhos -->
  <circle cx="23" cy="28" r="2.4" fill="#3c3c3c"/>
  <circle cx="41" cy="28" r="2.4" fill="#3c3c3c"/>
  <circle cx="23.8" cy="27.2" r="0.8" fill="#ffffff"/>
  <circle cx="41.8" cy="27.2" r="0.8" fill="#ffffff"/>
  <!-- bochechas -->
  <circle cx="18.5" cy="32.5" r="2" fill="#ff9db8" opacity="0.75"/>
  <circle cx="45.5" cy="32.5" r="2" fill="#ff9db8" opacity="0.75"/>
  <!-- sorriso -->
  <path d="M27 33 Q32 37 37 33" fill="none" stroke="#3c3c3c" stroke-width="1.8" stroke-linecap="round"/>
  <!-- marcador de página -->
  <path d="M46 43 L46 52 L49 49.5 L52 52 L52 43.8" fill="#ffc800" stroke="#e0a800" stroke-width="1.5" stroke-linejoin="round"/>
